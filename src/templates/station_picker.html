<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>火車站抽籤工具</title>
    <link rel="icon" href="https://img.icons8.com/emoji/48/train-emoji.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            overflow-x: hidden;
        }
        #display {
            width: 100%;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-align: center;
            margin-top: 2rem;
            border-radius: 1rem;
            opacity: .1;
            color: rgb(61, 132, 203);
            transition: background .3s;
            position: relative;
        }
        #display span#station {
            display: block;
            font-size: clamp(2rem, 10vw, 10rem);
            line-height: 1.2;
            word-break: break-word;
        }
        #display span#num {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
        }
        #display.active {
            opacity: 1;
            background: rgb(187, 189, 73);
        }
        .container-flex {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            min-width: 200px;
            max-width: 400px;
            width: 25%;
            overflow-y: auto;
            padding: 1rem;
            border-right: 1px solid rgba(255,255,255,0.1);
            background-color: rgba(255,255,255,0.05);
            resize: horizontal;
            overflow: auto;
        }
        .station-group .form-check-inline {
            margin: .1rem .25rem;
        }
        .station-list {
            display: none;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-top: 0.25rem;
        }
        .station-group.open .station-list {
            display: flex;
        }
        .city-label {
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .main-content {
            flex-grow: 1;
            padding: 2rem;
        }
        label.form-check-label {
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-dark text-light user-select-none">
<div class="container-flex">
    <div class="sidebar">
        <h5>選擇車站</h5>
        <form id="station-form">
            {% for city, stations in station_data.items() %}
                <div class="station-group" id="group_{{ city }}">
                    <div class="form-check form-switch mb-1">
                        <input class="form-check-input city-toggle" type="checkbox" id="city_{{ city }}" checked>
                        <label class="form-check-label city-label" for="city_{{ city }}">
                            <span class="city-name">{{ city }}</span>
                            <span class="toggle-btn" data-city="{{ city }}">▾</span>
                        </label>
                    </div>
                    <div class="station-list">
                        {% for station in stations %}
                            <div class="form-check form-check-inline">
                                <input class="form-check-input station-checkbox" type="checkbox" id="station_{{ station }}" name="stations" value="{{ station }}" data-city="{{ city }}" checked>
                                <label class="form-check-label small" for="station_{{ station }}">{{ station }}</label>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}
            <div class="text-center mt-3">
                <button type="button" id="toggleAllBtn" class="btn btn-sm btn-outline-light">✅ 全選 / 取消全選</button>
            </div>
        </form>
    </div>
    <div class="main-content">
        <h2 class="text-center mb-4">🚆 火車站抽籤工具</h2>
        <div class="text-center">
            <button id="startBtn" class="btn btn-success me-2">開始</button>
            <button id="stopBtn" class="btn btn-danger" disabled>停止</button>
        </div>
        <div id="display">
            <span id="station"></span>
            <span id="num" style="font-size: 1rem; color: black;"></span>
        </div>
    </div>
</div>

<script>
    let stations = []
    let currentIndex = 0
    let rolling = false
    let interval = null

    const startBtn = document.getElementById("startBtn")
    const stopBtn = document.getElementById("stopBtn")
    const display = document.getElementById("display")
    const toggleAllBtn = document.getElementById("toggleAllBtn")

    document.querySelectorAll(".toggle-btn").forEach(toggle => {
        toggle.addEventListener("click", (e) => {
            e.preventDefault()
            e.stopPropagation()
            const city = toggle.getAttribute("data-city")
            const group = document.getElementById(`group_${city}`)
            group.classList.toggle("open")
        })
    })

    document.querySelectorAll(".city-toggle").forEach(cityCheckbox => {
        cityCheckbox.addEventListener("change", () => {
            const city = cityCheckbox.id.replace("city_", "")
            document.querySelectorAll(`.station-checkbox[data-city='${city}']`).forEach(cb => {
                cb.checked = cityCheckbox.checked
            })
        })
    })

    toggleAllBtn.onclick = () => {
        const allStationCheckboxes = document.querySelectorAll(".station-checkbox")
        const allChecked = Array.from(allStationCheckboxes).every(cb => cb.checked)
        allStationCheckboxes.forEach(cb => cb.checked = !allChecked)
        document.querySelectorAll(".city-toggle").forEach(cityCb => cityCb.checked = !allChecked)
    }

    startBtn.onclick = async () => {
        display.classList.remove("active")
        display.querySelector("#num").innerHTML = ""
        const selectedStations = Array.from(document.querySelectorAll("input[name='stations']:checked")).map(c => c.value)

        if (selectedStations.length === 0) {
            alert("請至少選擇一個車站")
            return
        }

        stations = selectedStations.sort(() => Math.random() - 0.5)

        rolling = true
        startBtn.disabled = true
        stopBtn.disabled = false

        interval = setInterval(() => {
            currentIndex = (currentIndex + 1) % stations.length;
            display.querySelector("#station").innerHTML = stations[currentIndex];
        }, 50)
    }

    stopBtn.onclick = () => {
        if (rolling) {
            clearInterval(interval)
            rolling = false
            startBtn.disabled = false
            stopBtn.disabled = true
            display.classList.add("active")
            display.querySelector("#num").innerHTML = "/ " + stations.length
        }
    }
</script>
</body>
</html>
